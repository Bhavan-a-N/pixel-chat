# Render Blueprint (optional). Create services manually in the dashboard if you prefer.
# Region: Singapore (closest to Bengaluru for Render + co-located Key Value).

services:
  - type: web
    name: pixel-chat-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    preDeployCommand: python scripts/pre_deploy_migrate.py
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "30"
